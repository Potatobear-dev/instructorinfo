function layoutCap(l){return {'1x1':1,'1x2':2,'1x3':3,'1x4':4,'3x2':6,'4x2':8}[l]||4;}
function defaultCat(list){const c={};list.forEach(p=>{const f=(p.fields||[])[0];if(f)c[f]=(c[f]||0)+1;});const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return k?k.replace(/\/.*$/,''):'';}
function openCart(kind){cartKind=kind||F.tab;cartPrune();renderCart();$('#cartModal').classList.add('open');}
function renderCart(){
  const kind=cartKind,list=cartList(kind),n=list.length;
  const box=$('#cartBox');
  const seg=['main','special'].map(k=>`<button type="button" class="seg ${k===kind?'on':''}" data-ca="kind" data-k="${k}">${KIND_NAME[k]}<b>${CART[k].length}</b></button>`).join('');
  let opts='';
  if(kind==='special'&&n){
    const rl=resolveLayout(n),cap=layoutCap(rl),pages=Math.ceil(n/cap);
    const cat=(CARTCFG.cat!==''&&CARTCFG.cat!==undefined)?CARTCFG.cat:defaultCat(list);
    opts=`<div class="fs cart-opt"><div class="eb">Layout <em>페이지 형식</em></div>
      <div class="chipset"><button type="button" class="chipb ${CARTCFG.layout==='auto'?'on':''}" data-ca="layout" data-v="auto">자동 (권장)</button>${SP_LAYOUTS.map(l=>`<button type="button" class="chipb ${CARTCFG.layout===l[0]?'on':''}" data-ca="layout" data-v="${l[0]}">${l[1]}<small>${l[2]}</small></button>`).join('')}</div>
      <p class="sub" style="margin:8px 0 0">적용: <b>${SP_LAYOUTS.find(x=>x[0]===rl)[1]}</b> · 총 <b>${pages}장</b>${CARTCFG.layout==='auto'?' (4명 이하는 1×N, 5명 이상은 3×2로 자동 선택)':''}${rl.startsWith('1x')?'':' · 3×2/4×2 카드에는 강사료와 저서 이미지가 들어가지 않습니다'}</p>
      ${rl.startsWith('1x')?`<div class="f" style="margin-top:10px"><label>우측 상단 부문 표기 <span class="sub" style="font-weight:400">(1×N 형식 · 비우면 표기 안 함)</span></label><input class="inp" id="cartCat" value="${esc(cat)}" placeholder="예: 인문학"></div>`:''}</div>`;
  }
  box.innerHTML=`<div class="m-head"><h2>프로필 장바구니</h2><i>${kind==='main'?'일반 · 1page 1명':'특강 · 카드형'}</i><button class="x" data-ca="close" aria-label="닫기">×</button></div>
  <div class="m-body"><div class="fs" style="border:0;padding-bottom:6px">
    <div class="segs">${seg}</div>
    <p class="sub" style="margin:8px 0 12px">일반·출강과 특강은 양식이 달라 장바구니를 따로 쓰며, 한 파일에 섞을 수 없습니다. 담기는 현재 탭 기준입니다.</p>
    ${n?`<div class="cart-list">${list.map((p,i)=>{const fl=cartFlags(p,kind);return `<div class="cart-row"><span class="no">${i+1}</span>${avatar(p)}<div class="who"><b>${esc(p.name)}</b><small>${esc(p.org||'')}</small>${fl.length?`<div class="flags">${fl.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}</div><div class="ctl"><button type="button" class="ib" data-ca="up" data-i="${i}" ${i?'':'disabled'} aria-label="위로">▲</button><button type="button" class="ib" data-ca="down" data-i="${i}" ${i<n-1?'':'disabled'} aria-label="아래로">▼</button><button type="button" class="ib x" data-ca="rm" data-i="${i}" aria-label="빼기">✕</button></div></div>`;}).join('')}</div>`:`<div class="empty" style="padding:30px 10px"><b>${KIND_NAME[kind]} 장바구니가 비어 있습니다</b>강사 카드의 「＋ 담기」를 누르세요.</div>`}
  </div>${opts}</div>
  <div class="m-foot"><span class="hint" id="cartMsg">${n?`${KIND_NAME[kind]} ${n}명 · 순서대로 페이지가 만들어집니다`:''}</span>${n?'<button type="button" class="btn line" data-ca="clear">비우기</button>':''}<button type="button" class="btn red" data-ca="make" ${n?'':'disabled'}>PPTX 만들기</button></div>`;
  hydratePhotos(box);
}
$('#cartBox').addEventListener('click',e=>{
  const b=e.target.closest('[data-ca]');if(!b)return;const k=b.dataset.ca,i=+b.dataset.i;
  if(k==='close'){$('#cartModal').classList.remove('open');return;}
  if(k==='kind'){cartKind=b.dataset.k;renderCart();return;}
  const a=CART[cartKind];
  if(k==='up'&&i>0){[a[i-1],a[i]]=[a[i],a[i-1]];}
  else if(k==='down'&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];}
  else if(k==='rm'){a.splice(i,1);}
  else if(k==='clear'){if(!confirm(`${KIND_NAME[cartKind]} 장바구니를 비울까요?`))return;a.length=0;}
  else if(k==='layout'){CARTCFG.layout=b.dataset.v;}
  else if(k==='make'){return makePptx(cartKind);}
  saveCart();renderCart();syncCartUI();
});
$('#cartBox').addEventListener('input',e=>{if(e.target.id==='cartCat'){CARTCFG.cat=e.target.value;saveCart();}});
$('#cartBar').addEventListener('click',e=>{if(e.target.closest('[data-ca="open"]'))openCart(F.tab);});

/* ---------- 이미지 준비 (webp → JPEG: 구버전 PowerPoint 호환) ---------- */
function loadImgEl(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}
async function toJpeg(url,maxPx){
  const img=await loadImgEl(url);const sc=Math.min(1,maxPx/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
  return {bytes:new Uint8Array(await b.arrayBuffer()),ext:'jpeg',w:c.width,h:c.height};
}
async function prepImages(list,kind,setMsg){
  const imgs={};let n=0;
  for(const p of list){
    n++;setMsg&&setMsg(`이미지 준비 ${n}/${list.length}`);
    for(const [k,ref] of [['photo',p.photo],['book',kind==='special'?p.book:null]]){
      if(!ref)continue;
      try{const u=await photoURL(ref);if(u)imgs[p.id+':'+k]=await toJpeg(u,k==='book'?700:900);}catch(e){}
    }
  }
  return imgs;
}
function tplBytesB64(){return $('#tplData').textContent.trim();}
async function makePptx(kind){
  const list=cartList(kind);if(!list.length)return;
  const btn=$('[data-ca="make"]',$('#cartBox')),msg=$('#cartMsg');
  const setMsg=t=>{if(msg)msg.textContent=t;};
  btn.disabled=true;
  try{
    if(typeof JSZip==='undefined')throw new Error('내보내기 모듈을 불러오지 못했습니다 — 새로고침 후 다시 시도하세요');
    const missing=list.filter(p=>p.photo).length;
    if(missing&&!CFG)throw new Error('사진은 GitHub 연결 후에 불러올 수 있습니다');
    const imgs=await prepImages(list,kind,setMsg);
    setMsg('PPTX 조립 중…');
    const tpl=tplBytesB64();
    const zt=await JSZip.loadAsync(tpl,{base64:true});
    const lg=await zt.file('ppt/media/image8.png').async('uint8array');
    imgs.__logo={bytes:lg,ext:'png',w:438,h:32};
    const slides=[];let warns=[];
    if(kind==='main'){
      list.forEach(p=>{const r=buildGeneral(p,imgs[p.id+':photo']);slides.push(r.slide);if(r.warn)warns.push(p.name+(r.trimmed?` (일부 항목 ${r.trimmed}건 생략)`:' (글이 많아 글자 크기를 줄임)'));});
    }else{
      const rl=resolveLayout(list.length),cap=layoutCap(rl);
      const cat=(CARTCFG.cat!==''&&CARTCFG.cat!==undefined)?CARTCFG.cat:defaultCat(list);
      for(let i=0;i<list.length;i+=cap){
        const chunk=list.slice(i,i+cap);
        slides.push(rl.startsWith('1x')?buildSpecialRow(chunk,cat,imgs):buildSpecialGrid(chunk,rl==='3x2'?3:4,imgs));
      }
    }
    const zip=await assemble(JSZip,tpl,slides);
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation',compression:'DEFLATE'});
    const d=new Date(),ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`강사프로필_${kind==='main'?'일반':'특강'}_${ymd}.pptx`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    setMsg(`완료 — ${slides.length}장${warns.length?' · 확인 필요: '+warns.join(', '):''}`);
    toast(`PPTX ${slides.length}장을 만들었습니다`+(warns.length?' — 일부 슬라이드는 글이 많아 조정했습니다':''),4500);
  }catch(e){setMsg('실패: '+e.message);toast('PPTX 생성 실패: '+e.message,6000);}
  finally{btn.disabled=false;}
}
loadCart();

/* =====================================================================
   전역 이벤트
   ===================================================================== */
document.addEventListener('click',async e=>{
  const menu=$('#menu');
  if(e.target.closest('#btnMenu')){menu.classList.toggle('open');return;}
  if(!e.target.closest('#menu'))menu.classList.remove('open');
  const cbt=e.target.closest('[data-cart]');if(cbt){e.stopPropagation();toggleCart(cbt.dataset.cart);return;}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;menu.classList.remove('open');
    const p=DB.instructors.find(x=>x.id===curId);
    switch(act){
      case 'connect':return openConnect();
      case 'closeConnect':$('#connModal').classList.remove('open');return;
      case 'doConnect':return doConnect();
      case 'pull':return pull(false);
      case 'retry':return SYNC.state==='error'&&!SHA?pull(false):pushNow();
      case 'disconnect':return disconnect();
      case 'lock':return lockNow();
      case 'unlock':return openUnlock();
      case 'closeUnlock':$('#unlockModal').classList.remove('open');return;
      case 'doUnlock':return doUnlock();
      case 'useRemote':return resolveConflict(true);
      case 'useLocal':return resolveConflict(false);
      case 'exportJson':return exportJson();
      case 'importJson':return importJson();
      case 'exportCsv':return exportCsv();
      case 'paste':return openPaste();
      case 'profImport':return openProfileImport();
      case 'syn':return openSyn();
      case 'synSave':return saveSyn();
      case 'synReset':$('#synTa').value=DEFAULT_SYN.join('\n');return;
      case 'applyProfiles':return applyProfiles();
      case 'closePaste':$('#pasteModal').classList.remove('open');return;
      case 'doPaste':return doPaste();
      case 'reset':Object.assign(F,{q:'',field:'',grade:'',target:'',tone:'',payment:'',rate:'',rlo:0,rhi:1000,rnone:false,status:''});$('#q').value='';return render();
      case 'closeDrawer':return closeDrawer();
      case 'edit':return openForm(curId);
      case 'closeForm':return closeForm();
      case 'saveForm':return saveForm();
      case 'toggleAccess':showAccess=!showAccess;return drawDetail();
      case 'copyProfile':if(p){const ok=await copyText(profileText(p));toast(ok?'제안서용 프로필 텍스트를 복사했습니다':'복사에 실패했습니다');}return;
      case 'dup':if(p){const c=clone(p);c.id=uid();c.photo=null;c.book=null;c.name=p.name+' (복제)';c.createdAt=c.updatedAt=nowISO();DB.instructors.push(c);persist('복제: '+p.name);renderList();openDrawer(c.id);toast('복제했습니다');}return;
      case 'del':if(p&&confirm(`「${p.name}」 강사를 삭제할까요? 되돌릴 수 없습니다.`)){if(p.photo&&CFG)ghDeletePath(p.photo.path,p.photo.sha,'사진 삭제: '+p.name).catch(()=>{});if(p.book&&CFG)ghDeletePath(p.book.path,p.book.sha,'저서 이미지 삭제: '+p.name).catch(()=>{});DB.instructors=DB.instructors.filter(x=>x.id!==p.id);persist('삭제: '+p.name);closeDrawer();renderList();toast('삭제했습니다');}return;
    }
  }
  const more=e.target.closest('[data-more]');if(more){expanded[more.dataset.more]=!expanded[more.dataset.more];drawDetail();return;}
  const tb=e.target.closest('[data-tab]');if(tb){F.tab=tb.dataset.tab;F.rate='';F.rlo=0;F.rhi=1000;F.rnone=false;saveView();render();return;}
  const v=e.target.closest('[data-view]');if(v){F.view=v.dataset.view;saveView();render();return;}
  const item=e.target.closest('[data-id]');if(item&&e.target.closest('#list'))openDrawer(item.dataset.id);
});
$('#scrim').addEventListener('click',closeDrawer);
$('#btnAdd').addEventListener('click',()=>openForm(null));
$('#filters').addEventListener('change',e=>{const s=e.target.closest('[data-f]');if(!s)return;F[s.dataset.f]=s.value;if(s.dataset.f==='sort')saveView();render();});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{F.q=e.target.value;renderList();},120);});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#connBox')&&e.target.tagName==='INPUT'){e.preventDefault();return doConnect();}
  if(e.key==='Enter'&&e.target.id==='uPass'){e.preventDefault();return doUnlock();}
  if(e.key==='Escape'&&$('#unlockModal').classList.contains('open'))return $('#unlockModal').classList.remove('open');
  if(e.key==='Escape'&&$('#cartModal').classList.contains('open'))return $('#cartModal').classList.remove('open');
  if(e.key==='Escape'){if($('#formModal').classList.contains('open'))return closeForm();if($('#pasteModal').classList.contains('open'))return $('#pasteModal').classList.remove('open');if(curId)return closeDrawer();}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card'))openDrawer(e.target.dataset.id);
  if((e.ctrlKey||e.metaKey)&&e.key==='s'&&draft){e.preventDefault();saveForm();}
});
window.addEventListener('online',()=>{if(CFG&&['offline','dirty'].includes(SYNC.state))pushNow();});
window.addEventListener('focus',()=>{if(CFG&&SYNC.state==='ok'&&Date.now()-lastPull>60000)pull(true);});
window.addEventListener('beforeunload',e=>{if(UPLOADING||['dirty','saving','offline'].includes(SYNC.state)){e.preventDefault();e.returnValue='';}});

/* =====================================================================
   시작
   ===================================================================== */
(async function init(){
  CFG=lsGet(CFG_KEY);
  const cache=lsGet(CACHE_KEY);
  if(cache&&validDB(cache.obj)){ingest(cache.obj);SHA=cache.sha||null;pendingMsgs=cache.msgs||[];}
  await tryUnlockStored();
  render();
  if(!CFG){setSync('off');openConnect();return;}
  if(cache&&cache.dirty){rev++;await pushNow();}
  else await pull(false);
})();
})();
</script>
